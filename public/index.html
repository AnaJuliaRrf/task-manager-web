<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2=family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <style>
    /* --- VARIÁVEIS DE DESIGN (Originais do estudante) --- */
    :root {
      --bg-body: #f4f5f7;
      --bg-card: #ffffff;
      --primary: #4f46e5;      /* Roxo moderno */
      --primary-hover: #4338ca;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
    }

    /* --- RESET E ESTRUTURA --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* --- CONTAINER CENTRAL --- */
    .app-container {
      background: var(--bg-card);
      width: 100%;
      max-width: 500px;
      padding: 2rem;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 
                  0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* --- ÁREA DE INPUT --- */
    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 1.5rem;
    }

    input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    button {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 500;
      font-size: 0.95rem;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    button:active {
      transform: scale(0.98);
    }

    /* --- LISTA DE TAREFAS --- */
    ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    li {
      background: var(--bg-body);
      padding: 0.85rem 1rem;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid transparent;
      transition: all 0.2s;
      font-size: 0.95rem;
    }

    li:hover {
      border-color: var(--border);
      background: #fafafa;
    }

    .completed {
      text-decoration: line-through;
      color: var(--text-muted);
      opacity: 0.7;
    }

    /* --- NOVA SEÇÃO EXIGIDA: TESTE DO DOCKER /v1 --- */
    .docker-test-container {
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 2px dashed var(--border);
      text-align: center;
    }

    .btn-docker {
      background-color: #0284c7; /* Azul Docker */
      width: 100%;
      margin-bottom: 10px;
    }

    .btn-docker:hover {
      background-color: #0369a1;
    }

    #resposta {
      font-size: 0.85rem;
      color: var(--text-muted);
      background: var(--bg-body);
      padding: 10px;
      border-radius: 8px;
      min-height: 40px;
      word-break: break-all;
    }

    /* --- RODAPÉ / VERSÃO --- */
    .version {
      margin-top: 2rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>📝 Task Manager</h1>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Digite uma nova tarefa...">
      <button onclick="addTask()">Adicionar</button>
    </div>

    <ul id="taskList"></ul>

    <div class="docker-test-container">
      <button class="btn-docker" onclick="chamarAPI()">🧪 Testar API (v1)</button>
      <p id="resposta">Aguardando teste de conexão...</p>
    </div>

    <p class="version">v1.1.0 • CI/CD via Vercel + Render (Docker & Nginx)</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
